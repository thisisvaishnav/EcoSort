version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .vite/**/*
customHeaders:
  # Hashed Vite bundles: cache forever (content changes → new filename)
  - pattern: '/assets/**'
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
  # Entry HTML must always revalidate so users get new asset hashes
  - pattern: '/index.html'
    headers:
      - key: Cache-Control
        value: 'no-cache'
  - pattern: '/manifest.webmanifest'
    headers:
      - key: Cache-Control
        value: 'no-cache'
